metadata:
  name: "Input Element Mapping"
  source_ext: "csv"

# For each row create a Parameter, Element mapping
root:
  type: ["tool-coupler-ont:Parameter", "tool-coupler-ont:Input"]
  uri: "tool-coupler-r:input"
  varids: ["server_name", "tool_name", "parameter_name", "schema_type"]
  connections:
    # Element
    - p: "tool-coupler-ont:containsElement"
      inv: "tool-coupler-ont:elementOf"
      o:
        type: ["tool-coupler-ont:Element"]
        uri: "tool-coupler-r:element"
        varids:
          [
            "server_name",
            "tool_name",
            "parameter_name",
            "schema_type",
            "element_path",
          ]
        connections:
          # Datatypes
          - p: "tool-coupler-ont:isOfDataType"
            inv: "tool-coupler-ont:dataTypeOf"
            o:
              type: ["tool-coupler-ont:DataType"]
              uri: "tool-coupler-r:dataType"
              varids: ["datatype"]

          # Metadata
          - p: "tool-coupler-ont:hasMetadata"
            inv: "tool-coupler-ont:metadataOf"
            o:
              type: ["tool-coupler-ont:Metadata"]
              uri: "tool-coupler-r:metadata"
              varids:
                [
                  "server_name",
                  "tool_name",
                  "parameter_name",
                  "schema_type",
                  "element_path",
                ]
              connections:
                # Description
                - p: "tool-coupler-ont:hasDescription"
                  o:
                    datatype: "xsd:string"
                    val_source: "element_description"

                # Name
                - p: "tool-coupler-ont:hasName"
                  o:
                    datatype: "xsd:string"
                    val_source: "element_name"
